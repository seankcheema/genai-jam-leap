# UPGRADE (Spring Boot 2.5 -> 3.5): the "logging.file" property was renamed to
# "logging.file.name" back in Spring Boot 2.2 (kept working only as a soft-deprecated alias for
# a couple of major versions). By Spring Boot 3.5 the old "logging.file" key is no longer bound
# to anything at all - LogFile only reads "logging.file.name"/"logging.file.path" now - so
# leaving the old key in place would not fail the build, but would silently stop writing a log
# file (a functional regression that is easy to miss). Renamed here to keep file logging working.
logging.file.name=myapplication.log