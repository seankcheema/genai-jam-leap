spring.datasource.url=jdbc:mysql://cddb:3306/conygre
spring.datasource.username=root
spring.datasource.password=secret123
# UPGRADE: com.mysql.jdbc.Driver was the old MySQL Connector/J 5.x driver class name (mapped to
# the "mysql:mysql-connector-java" artifact that this project no longer depends on). The current
# com.mysql:mysql-connector-j artifact's canonical driver class is com.mysql.cj.jdbc.Driver
# (matches what src/main/resources/application.properties already used), so this is updated to
# match for consistency between the two profiles.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
